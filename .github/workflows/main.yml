name: Build Power BI Custom Visual

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Show environment
        run: |
          echo "=========================================="
          echo "ENVIRONMENT"
          echo "=========================================="
          node --version
          npm --version
          echo ""
          echo "Working directory:"
          pwd
          echo ""
          echo "Project files:"
          find . -maxdepth 2 -type f \
            ! -path "./node_modules/*" \
            ! -path "./.git/*" \
            | sort

      - name: Install dependencies
        run: |
          echo "=========================================="
          echo "INSTALLING DEPENDENCIES"
          echo "=========================================="

          npm install --no-fund --no-audit

          echo ""
          echo "Dependencies installed successfully."

      - name: Verify PBIViz tools
        run: |
          echo "=========================================="
          echo "VERIFYING PBIVIZ TOOL"
          echo "=========================================="

          npx pbiviz --version

      - name: Validate project
        run: |
          echo "=========================================="
          echo "VALIDATING PBIVIZ PROJECT"
          echo "=========================================="

          test -f pbiviz.json
          test -f capabilities.json
          test -f package.json
          test -f assets/icon.png

          echo "Required project files found."

      - name: Build PBIViz package
        run: |
          echo "=========================================="
          echo "BUILDING PBIVIZ PACKAGE"
          echo "=========================================="

          rm -rf dist
          mkdir -p dist

          npx pbiviz package

          echo ""
          echo "Build command completed."

      - name: Locate PBIViz package
        run: |
          echo "=========================================="
          echo "LOCATING PBIVIZ PACKAGE"
          echo "=========================================="

          echo "All generated PBIViz files:"
          find . \
            -type f \
            -name "*.pbiviz" \
            ! -path "./node_modules/*" \
            ! -path "./.git/*" \
            -print

          PBIVIZ_FILE=$(find . \
            -type f \
            -name "*.pbiviz" \
            ! -path "./node_modules/*" \
            ! -path "./.git/*" \
            -print -quit)

          if [ -z "$PBIVIZ_FILE" ]; then
            echo ""
            echo "ERROR: No .pbiviz file was generated."
            echo ""
            echo "=== dist contents ==="
            find dist -maxdepth 3 -type f -print 2>/dev/null || true
            echo ""
            echo "=== Project contents ==="
            find . \
              -maxdepth 3 \
              -type f \
              ! -path "./node_modules/*" \
              ! -path "./.git/*" \
              | sort
            exit 1
          fi

          echo ""
          echo "SUCCESS: PBIViz package found:"
          echo "$PBIVIZ_FILE"
          ls -lh "$PBIVIZ_FILE"

      - name: Copy PBIViz to dist
        run: |
          echo "=========================================="
          echo "PREPARING DIST"
          echo "=========================================="

          PBIVIZ_FILE=$(find . \
            -type f \
            -name "*.pbiviz" \
            ! -path "./node_modules/*" \
            ! -path "./.git/*" \
            -print -quit)

          cp "$PBIVIZ_FILE" dist/

          echo ""
          echo "dist contents:"
          ls -lah dist

      - name: Upload PBIViz artifact
        uses: actions/upload-artifact@v4
        with:
          name: directorio-clientes-pbiviz
          path: dist/*.pbiviz
          if-no-files-found: error

      - name: Final verification
        run: |
          echo "=========================================="
          echo "FINAL VERIFICATION"
          echo "=========================================="

          PBIVIZ_FILE=$(find dist \
            -maxdepth 1 \
            -type f \
            -name "*.pbiviz" \
            -print -quit)

          if [ -z "$PBIVIZ_FILE" ]; then
            echo "ERROR: Final PBIViz verification failed."
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "BUILD SUCCESSFUL"
          echo "=========================================="
          echo ""
          echo "PBIViz:"
          echo "$PBIVIZ_FILE"
          echo ""
          ls -lh "$PBIVIZ_FILE"