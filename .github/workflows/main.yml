name: Build PBIViz

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Power BI Custom Visual
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Show environment
        run: |
          echo "=========================================="
          echo "ENVIRONMENT"
          echo "=========================================="
          node --version
          npm --version
          echo ""
          pwd
          echo ""
          echo "Project files:"
          find . -maxdepth 2 -type f \
            ! -path './node_modules/*' \
            ! -path './.git/*' \
            | sort

      - name: Install dependencies
        run: |
          echo "=========================================="
          echo "INSTALLING DEPENDENCIES"
          echo "=========================================="

          npm install --no-fund --no-audit

          echo ""
          echo "Power BI Visual Tools:"
          npx pbiviz --version

      - name: Validate PBIViz project
        run: |
          echo "=========================================="
          echo "VALIDATING PBIVIZ PROJECT"
          echo "=========================================="

          test -f pbiviz.json || {
            echo "ERROR: pbiviz.json not found"
            exit 1
          }

          test -f capabilities.json || {
            echo "ERROR: capabilities.json not found"
            exit 1
          }

          test -f package.json || {
            echo "ERROR: package.json not found"
            exit 1
          }

          test -f src/visual.ts || {
            echo "ERROR: src/visual.ts not found"
            exit 1
          }

          test -f style/visual.less || {
            echo "ERROR: style/visual.less not found"
            exit 1
          }

          test -f assets/icon.png || {
            echo "ERROR: assets/icon.png not found"
            exit 1
          }

          echo "PBIViz project structure OK."

      - name: Clean build folders
        run: |
          echo "=========================================="
          echo "CLEANING BUILD FOLDERS"
          echo "=========================================="

          rm -rf dist
          rm -rf .tmp

          mkdir -p dist

      - name: Build PBIViz package
        run: |
          echo "=========================================="
          echo "BUILDING PBIVIZ PACKAGE"
          echo "=========================================="

          npx pbiviz package

      - name: Inspect build output
        if: always()
        run: |
          echo "=========================================="
          echo "BUILD OUTPUT"
          echo "=========================================="

          echo ""
          echo "--- dist ---"

          if [ -d "dist" ]; then
            ls -lah dist
          else
            echo "dist directory does not exist"
          fi

          echo ""
          echo "--- .tmp ---"

          if [ -d ".tmp" ]; then
            find .tmp -maxdepth 4 -type f | sort
          else
            echo ".tmp directory does not exist"
          fi

          echo ""
          echo "--- PBIVIZ FILES ---"

          find . \
            -type f \
            -name "*.pbiviz" \
            ! -path "./node_modules/*" \
            ! -path "./.git/*" \
            -print

      - name: Verify PBIViz package
        run: |
          echo "=========================================="
          echo "VERIFYING PBIVIZ PACKAGE"
          echo "=========================================="

          PBIVIZ_FILE=$(find dist -maxdepth 1 -type f -name "*.pbiviz" -print -quit 2>/dev/null || true)

          if [ -z "$PBIVIZ_FILE" ]; then
            echo ""
            echo "ERROR: No .pbiviz file was generated in dist/"
            echo ""

            echo "=== dist contents ==="
            ls -lah dist 2>/dev/null || true

            echo ""
            echo "=== PBIVIZ search ==="
            find . \
              -type f \
              -name "*.pbiviz" \
              ! -path "./node_modules/*" \
              ! -path "./.git/*" \
              -print

            exit 1
          fi

          echo ""
          echo "SUCCESS: PBIViz found"
          echo "$PBIVIZ_FILE"
          ls -lh "$PBIVIZ_FILE"

      - name: Prepare PBIViz artifact
        run: |
          echo "=========================================="
          echo "PREPARING ARTIFACT"
          echo "=========================================="

          PBIVIZ_FILE=$(find dist -maxdepth 1 -type f -name "*.pbiviz" -print -quit)

          if [ -z "$PBIVIZ_FILE" ]; then
            echo "ERROR: PBIViz package not found."
            exit 1
          fi

          cp "$PBIVIZ_FILE" "dist/DirectorioClientesAurum.pbiviz"

          echo ""
          ls -lh dist/DirectorioClientesAurum.pbiviz

      - name: Upload PBIViz artifact
        uses: actions/upload-artifact@v4
        with:
          name: DirectorioClientesAurum-PBIViz
          path: dist/DirectorioClientesAurum.pbiviz
          if-no-files-found: error

      - name: Build summary
        run: |
          echo "=========================================="
          echo "BUILD COMPLETED"
          echo "=========================================="
          echo ""
          echo "Artifact:"
          echo "DirectorioClientesAurum-PBIViz"
          echo ""
          ls -lh dist/DirectorioClientesAurum.pbiviz
          echo ""
          echo "STATUS: SUCCESS"