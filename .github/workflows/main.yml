name: Build PBIViz

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Show environment
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Build PBIViz package
        run: npm run package

      - name: Verify PBIViz
  run: |
    echo "=== Buscando archivos PBIViz ==="
    find . -type f -name "*.pbiviz" -print

    - name: Upload PBIViz
  uses: actions/upload-artifact@v4
  with:
    name: pbiviz-package
    path: "**/*.pbiviz"
    if-no-files-found: error

