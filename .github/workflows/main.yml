name: Build PBIViz

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Build PBIViz package
        run: npm run package

      - name: Verify PBIViz
        run: |
          echo "Archivos PBIViz generados:"
          ls -lah *.pbiviz

      - name: Upload PBIViz
        uses: actions/upload-artifact@v4
        with:
          name: pbiviz-package
          path: "*.pbiviz"
          if-no-files-found: error
