name: Build Power BI Custom Visual
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Show environment
        run: |
          echo "=========================================="
          echo "ENVIRONMENT"
          echo "=========================================="
          node --version
          npm --version
          echo ""
          echo "Working directory:"
          pwd
          echo ""
          echo "Project files:"
          find . -maxdepth 3 -type f \
            ! -path "./node_modules/*" \
            ! -path "./.git/*" \
            | sort
      - name: Install dependencies
        run: |
          echo "=========================================="
          echo "INSTALLING DEPENDENCIES"
          echo "=========================================="
          npm install --no-fund --no-audit
          echo ""
          echo "Dependencies installed."
      - name: Verify PBIViz tools
        run: |
          echo "=========================================="
          echo "VERIFYING PBIVIZ TOOL"
          echo "=========================================="
          npx pbiviz --version
      - name: Validate project files
        run: |
          echo "=========================================="
          echo "VALIDATING PROJECT"
          echo "=========================================="
          test -f package.json
          test -f package-lock.json
          test -f pbiviz.json
          test -f capabilities.json
          test -f tsconfig.json
          test -f src/visual.ts
          test -f style/visual.less
          test -f assets/icon.png
          echo ""
          echo "All required project files exist."
      - name: Build PBIViz package
        run: |
          echo "=========================================="
          echo "BUILDING PBIVIZ PACKAGE"
          echo "=========================================="
          rm -rf dist
          mkdir -p dist
          echo ""
          echo "=== PBIViz version ==="
          npx pbiviz --version
          echo ""
          echo "=== pbiviz.json ==="
          cat pbiviz.json
          echo ""
          echo "=== package.json scripts ==="
          npm pkg get scripts
          echo ""
          echo "=== TypeScript version ==="
          npx tsc --version
          echo ""
          echo "=== Running PBIViz package ==="
          npx pbiviz package --verbose
          echo ""
          echo "=========================================="
          echo "PBIVIZ COMMAND FINISHED"
          echo "=========================================="
          echo ""
          echo "=== Root directory ==="
          ls -lah
          echo ""
          echo "=== dist directory ==="
          ls -lah dist || true
          echo ""
          echo "=== Searching PBIViz files ==="
          find . \
            -type f \
            -name "*.pbiviz" \
            ! -path "./node_modules/*" \
            ! -path "./.git/*" \
            -print
          echo ""
          echo "=== Searching ZIP/package files ==="
          find . \
            -type f \
            \( -name "*.pbiviz" -o -name "*.zip" \) \
            ! -path "./node_modules/*" \
            ! -path "./.git/*" \
            -print
      # ============================================================
      # ONLY NEW STEP: UPLOAD THE GENERATED PBIVIZ AS ARTIFACT
      # ============================================================
      - name: Upload PBIViz artifact
        uses: actions/upload-artifact@v4
        with:
          name: DirectorioClientesAurum-PBIViz
          path: dist/*.pbiviz
          if-no-files-found: error
          retention-days: 30